plugins {
    id 'com.android.application'
}

android {
    namespace 'com.silentcam.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.silentcam.app'
        minSdk 29
        targetSdk 34
        def run = System.getenv('GITHUB_RUN_NUMBER') ?: '1'
        versionCode Integer.parseInt(run)
        versionName "1.0.${run}"
    }

    // 매번 같은 열쇠로 서명해야 새 버전이 기존 앱 위에 덮여 설치된다
    signingConfigs {
        debug {
            storeFile file('silentcam.keystore')
            storePassword 'silentcam2026'
            keyAlias 'silentcam'
            keyPassword 'silentcam2026'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin'
                && (details.requested.name == 'kotlin-stdlib-jdk7'
                 || details.requested.name == 'kotlin-stdlib-jdk8')) {
            details.useTarget 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:${camerax}"
    implementation "androidx.camera:camera-camera2:${camerax}"
    implementation "androidx.camera:camera-lifecycle:${camerax}"
    implementation "androidx.camera:camera-view:${camerax}"
    implementation "androidx.camera:camera-video:${camerax}"
    // 삼성 카메라의 자체 화질 처리(HDR·야간·자동 보정)를 빌려 쓰는 기능
    implementation "androidx.camera:camera-extensions:${camerax}"
    implementation 'com.google.guava:listenablefuture:1.0'
}
