# 무음카메라 앱 자동 빌드
# 코드가 바뀌어 올라오면 GitHub가 APK를 만들어 'Releases'에 올립니다.
# Obtainium이 새 Release를 보고 업데이트를 알려줍니다.

name: 무음카메라 앱 만들기

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 만들기
        run: gradle assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk SilentCam.apk

      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 무음카메라 ${{ github.run_number }}번째 빌드
          body: 아래 Assets에서 SilentCam.apk를 내려받아 설치하세요. Obtainium을 쓰면 자동으로 업데이트됩니다.
          files: SilentCam.apk
          make_latest: true
